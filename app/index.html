<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GramPedia</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#13213a;--paper:#f3f5f9;--card:#fff;--line:#dde3ec;--muted:#627089;--blue:#2a8bd8;--blue-ink:#1b6fb3;--ok:#1f8a5b;--warn:#b7791f;--bad:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 'DM Sans',system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.serif{font-family:Fraunces,Georgia,serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header .r{display:flex;align-items:center;gap:10px}
header .logo{font:800 22px Fraunces,Georgia,serif;letter-spacing:-.01em;flex:1}
header .logo small{font:500 12px 'DM Sans',sans-serif;opacity:.65;margin-left:6px;letter-spacing:0}
.iconb{border:0;background:rgba(255,255,255,.12);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px}
.search input{border:0;outline:0;flex:1;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
.search span{opacity:.5}
main{padding:16px 16px calc(92px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
h1{font:800 28px/1.15 Fraunces,Georgia,serif;margin:6px 0 8px;letter-spacing:-.01em}
h2{font:700 19px Fraunces,Georgia,serif;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
/* the shelf: topics as book spines */
.shelf{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 14px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;align-items:flex-end;border-bottom:3px solid #c9d2df}
.shelf::-webkit-scrollbar{display:none}
.spine{flex:none;width:52px;border:0;border-radius:5px 5px 2px 2px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 7px;box-shadow:inset -4px 0 0 rgba(0,0,0,.14),inset 3px 0 0 rgba(255,255,255,.12);transition:transform .15s}
.spine .e{font-size:18px}
.spine .n{writing-mode:vertical-rl;transform:rotate(180deg);font:600 13px Fraunces,Georgia,serif;white-space:nowrap;max-height:150px;overflow:hidden;text-overflow:ellipsis;margin:6px 0}
.spine .c{font:700 11px 'DM Sans',sans-serif;opacity:.85}
.spine[aria-pressed=true]{transform:translateY(-10px);outline:3px solid var(--ink);outline-offset:1px}
.types{display:flex;gap:6px;margin:14px 0 4px}
.lsel{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-weight:700;color:var(--ink);max-width:60%}
.types button{flex:1;min-width:0;padding-left:2px;padding-right:2px;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px;cursor:pointer}
.types button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sortr{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;color:var(--muted);font-size:14px}
.sortr button{border:0;background:none;color:var(--blue-ink);font-weight:700;cursor:pointer;padding:4px}
/* the index */
.idx{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:#e7ecf3;display:flex;align-items:center;justify-content:center;font-size:24px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:700 16.5px Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .m{font-size:13px;color:var(--muted);font-weight:500}
.row .t p{margin:2px 0 0;font-size:14px;color:#3a4558;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank{font:800 15px Fraunces,Georgia,serif;color:var(--muted);width:20px;text-align:center;flex:none}
.row.feat{background:#fffaf0}.spons{display:inline-block;font-size:12px;font-weight:700;color:#7c4a03;background:#fdf0d5;border-radius:999px;padding:1px 8px;margin-right:4px}
.fopt{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.fopt b{font-size:19px}.fopt p{margin:6px 0 10px;color:#3a4558}.fopt .hint{font-weight:700;color:var(--ink)}
.btn.gold{background:#f2b632;color:var(--ink)}
.tiers{display:grid;gap:6px;margin:0 0 12px}.tier{display:flex;gap:10px;align-items:center;background:#f3f5f9;border-radius:10px;padding:8px 10px;font-size:14px}.tier b{width:28px;height:28px;border-radius:50%;background:#e1e7f0;display:flex;align-items:center;justify-content:center;flex:none}.tier.on{background:#dcf2e7}
.bdot{position:absolute;top:-4px;right:-4px;background:#e11d48;color:#fff;font:700 11px 'DM Sans',sans-serif;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}.bdot[hidden]{display:none}
.nrow{padding:12px 14px;border-bottom:1px solid var(--line)}.nrow:last-child{border-bottom:0}.nrow p{margin:4px 0 0;white-space:pre-wrap}
.agx{display:block;background:#13213a;color:#fff;border-radius:16px;padding:16px;margin-top:16px;text-align:left;cursor:pointer}.agx b{display:block;font-size:19px;margin:8px 0 4px}.agx p{color:#c9d6ea;margin:0 0 12px;font-size:15px}.agx .agxb{background:#f2b632;color:#13213a;width:100%}.row.agxr{background:#f5f8ff}
.more{display:block;width:100%;margin:14px 0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty b{display:block;color:var(--ink);font:700 19px Fraunces,Georgia,serif;margin-bottom:6px}
/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:#e7ecf3;color:var(--ink);text-decoration:none}
.btn.main{background:var(--blue);color:#fff;width:100%;font-size:16.5px;padding:15px}
.btn.main:disabled{opacity:.55}
.btn.dark{background:var(--ink);color:#fff}
.btn.small{padding:8px 12px;font-size:14px}
label.f{display:block;font-weight:700;margin:18px 0 7px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--bad);font-weight:700;margin:10px 0 0}
.pickrow{display:flex;gap:8px}
.pickrow .inp{flex:1;min-width:0}
.lgrid{display:flex;flex-wrap:wrap;gap:6px}.lgrid button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700;cursor:pointer}.lgrid button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.drow .hint{margin:0}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.25}
.tgrid button span{display:block;font-size:20px}
.tgrid button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.found{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.photo{display:flex;align-items:center;gap:12px}
.bprev{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:0 0 10px;background:#e7ecf3}
.photo img{width:64px;height:64px;border-radius:12px;object-fit:cover}
/* mine */
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#e7ecf3}
.pill.approved{background:#dcf2e7;color:#14532d}.pill.pending{background:#fdf0d5;color:#7c4a03}.pill.refused,.pill.unsub{background:#fde3d7;color:#7c2d12}
/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(19,33,58,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d3dae5;margin:0 auto 12px}
.sheet .hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#e7ecf3}
.sheet h3{font:800 24px/1.2 Fraunces,Georgia,serif;margin:14px 0 4px}
.sheet .m{color:var(--muted);font-size:14px;font-weight:500}
.sheet p{white-space:pre-wrap;color:#2b3547}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:30;max-width:90vw;text-align:center}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.bar button{border:0;background:none;padding:7px 2px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px}
nav.bar button span{display:block;font-size:21px;line-height:1.2}
nav.bar button[aria-current=page]{color:var(--ink);background:#e9eef6}
body.typing nav.bar{display:none}
.center{text-align:center;padding:30px 6px}
.center .big{font-size:58px}
.load{display:flex;justify-content:center;padding:40px}.load i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet,.load i,.spine{animation:none;transition:none}}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}.faq summary{font-weight:700;cursor:pointer}.faq p{margin:8px 0 0;color:#3a4558}
</style></head>

// ---------- Sharing and notifications ----------
const BOTU = () => 'https://t.me/' + ((ME && ME.bot) || 'Grampedia_bot');
function shareListing(x) { if (!x) return; haptic(); openLink('https://t.me/share/url?url=' + encodeURIComponent(BOTU() + '?start=l_' + x.id) + '&text=' + encodeURIComponent('📚 ' + x.name + (x.descr ? '\n' + String(x.descr).slice(0, 140) : ''))); }
function shareApp() { haptic(); openLink('https://t.me/share/url?url=' + encodeURIComponent(BOTU() + '?start=src_share') + '&text=' + encodeURIComponent(t('inv_share'))); }
async function notifs() {
  TAB = 'notifs'; bar(); $('sbox').style.display = 'none'; load();
  const r = await api('notifs'); const xs = r.items || [];
  $('bdot').hidden = true; api('notifs_seen').catch(() => {});
  const when = (iso) => new Date(iso).toLocaleString((ME && ME.lang) || 'en', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('app').innerHTML = `<h1>${esc(t('notifs'))}</h1>` + (xs.length ? `<div class="idx">${xs.map((n) => `<div class="nrow"><span class="hint">${n.all ? '📣 ' : ''}${esc(when(n.at))}</span><p>${esc(n.text)}</p></div>`).join('')}</div>` : `<div class="empty"><b>${esc(t('notifs_none'))}</b></div>`);
}

// ---------- Partner: Ads Galaxy (affiliate link) ----------
const AGX = 'https://t.me/Ads_Galaxy_bot?start=AGX7057960224';
function agxCard(place) { return `<div class="agx" data-agx="${place}"><span class="spons">${esc(t('partner'))}</span><b class="serif">${esc(t('agx_title'))}</b><p>${esc(t(place === 'after' ? 'agx_after' : 'agx_mine'))}</p><span class="btn agxb">${esc(t('agx_btn'))}</span></div>`; }
function agxRow() { return `<button class="row agxr" data-agx="list"><div class="thumb">🚀</div><span class="t"><b>Ads Galaxy</b><span class="m"><span class="spons">${esc(t('partner'))}</span></span><p>${esc(t('agx_card'))}</p></span></button>`; }
function bindAgx() { document.querySelectorAll('[data-agx]').forEach((el) => { if (el.dataset.bound) return; el.dataset.bound = '1'; el.onclick = () => { api('agx', { place: el.dataset.agx }).catch(() => {}); openLink(AGX); }; }); }

// ---------- My listings ----------
async function mine() {
  load(); $('sbox').style.display = 'none'; const r = await api('mine'); const xs = r.items || [];
  $('app').innerHTML = `<h1>${esc(t('mine'))}</h1>` + (xs.length ? `<div class="idx">${xs.map((x) => `<div class="row" style="cursor:default">${thumb(x)}<span class="t"><b>${esc(x.name)}</b><span class="m">${esc(metaOf(x))}</span>${x.status === 'approved' && x.stats ? `<span class="m" style="display:block;margin-top:4px">📊 ${esc(t('stats7', { v: nf(x.stats.v7), c: nf(x.stats.c7) }))}</span>` : ''}${(x.feats || []).map((f) => `<span class="spons" style="display:inline-block;margin-top:4px">${esc(f.status === 'active' ? t(f.slot === 'home' ? 'feat_on_home' : 'feat_on_topic', { d: dfmt(f.ends_at) }) : t('feat_soon', { d: dfmt(f.starts_at) }))}</span>`).join(' ')}${x.why ? `<span class="m" style="display:block;margin-top:4px;white-space:pre-line">${esc(t('why_l'))} ${esc(x.why)}</span>` : ''}<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="pill ${x.status}">${esc(t('st_' + x.status))}</span>${x.editing ? `<span class="pill pending">${esc(t('editing'))}</span>` : ''}${['approved', 'pending'].includes(x.status) && !x.editing ? `<button class="btn small" data-ed="${x.id}">✏️ ${esc(t('edit'))}</button>` : ''}${x.post ? `<button class="btn small" data-open="${esc(x.post)}">${esc(t('see_post'))}</button>` : ''}${x.status === 'approved' ? `<button class="btn small" data-sh="${x.id}">📤 ${esc(t('share'))}</button>` : ''}${['approved', 'pending'].includes(x.status) ? `<button class="btn small" data-rm="${x.id}">${esc(t('remove'))}</button>` : ''}</div></span></div>`).join('')}</div>`
    : `<div class="empty"><b>${esc(t('mine_empty_t'))}</b>${esc(t('mine_empty'))}<div style="margin-top:14px"><button class="btn dark" id="madd">${esc(t('none_btn'))}</button></div></div>`);
  if ($('madd')) $('madd').onclick = () => go('add');
  $('app').querySelectorAll('[data-ed]').forEach((b) => b.onclick = () => editForm(xs.find((x) => String(x.id) === b.dataset.ed), 'mine'));
  $('app').querySelectorAll('[data-sh]').forEach((b) => b.onclick = () => shareListing(xs.find((x) => String(x.id) === b.dataset.sh)));
  if (xs.length) { $('app').insertAdjacentHTML('beforeend', agxCard('mine')); bindAgx(); }
  $('app').querySelectorAll('[data-ft]').forEach((b) => b.onclick = () => feature(xs.find((x) => String(x.id) === b.dataset.ft)));

  if ($('invb')) $('invb').onclick = () => openLink('https://t.me/share/url?url=' + encodeURIComponent(r.refLink || '') + '&text=' + encodeURIComponent(t('inv_share')));
  $('app').querySelectorAll('[data-open]').forEach((b) => b.onclick = () => openLink(b.dataset.open));
  $('app').querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const doIt = async (ok) => { if (!ok) return; await api('remove', { id: b.dataset.rm }); mine(); }; if (tgw && tgw.showConfirm) tgw.showConfirm(t('remove_q'), doIt); else doIt(confirm(t('remove_q'))); });
}

// ---------- Moderation (owner only) ----------
async function mod() {
  load(); const r = await api('mod'); const xs = r.items || [];
  $('app').innerHTML = `<h1>${esc(t('mod'))}</h1><p class="sub">${nf(r.users)} ${esc(t('mod_users'))}, ${nf(r.live)} ${esc(t('mod_live'))}, ${nf(r.wait)} ${esc(t('mod_wait'))}</p>`
    + (xs.length ? xs.map((x) => `<div class="idx" style="margin-bottom:14px" id="m${x.id}">${x.img ? `<img src="${API + x.img}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:contain;background:#e7ecf3;display:block">` : ''}<div style="padding:14px">${x.edit ? `<span class="pill pending" style="margin-bottom:8px">✏️ ${esc(t('mod_edit'))}</span><br>` : ''}<b class="serif" style="font-size:20px">${esc(x.edit ? x.edit.name : x.name)}</b><div class="hint" style="margin:4px 0 8px">${esc(metaOf(x.edit ? { ...x, ...x.edit } : x))}${x.uname ? ' · @' + esc(x.uname) : ''}${x.edit && x.edit.photo ? ' · 🖼️' : ''}</div>${x.fr ? `<p style="margin:0 0 8px">${esc(x.fr)}</p><details class="hint" style="margin:0 0 8px"><summary>${esc(t('mod_orig'))}</summary>${esc(x.edit ? x.edit.descr : x.descr || '')}</details>` : `<p style="margin:0 0 8px">${esc(x.edit ? x.edit.descr : x.descr || '')}</p>`}${x.edit && (x.edit.name !== x.name || x.edit.descr !== x.descr) ? `<p class="hint" style="margin:0 0 8px;text-decoration:line-through">${esc(x.name)}: ${esc(x.descr || '')}</p>` : ''}<p class="hint" style="margin:0 0 12px">${esc(t('mod_by', { who: x.by }))}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn main" data-ok="${x.id}" data-kind="${x.edit ? 'edit' : ''}">✅ ${esc(t('mod_ok'))}</button><button class="btn" data-no="${x.id}" data-kind="${x.edit ? 'edit' : ''}">❌ ${esc(t('mod_no'))}</button></div><button class="btn small" data-open="${esc(x.link)}" style="width:100%;margin-top:8px">🔗 ${esc(t('open'))} ${x.uname ? '@' + esc(x.uname) : ''}</button></div></div>`).join('')
      : `<div class="empty"><b>${esc(t('mod_none'))}</b>${esc(t('mod_none_t'))}</div>`);
  $('app').insertAdjacentHTML('beforeend', `<div class="idx" style="margin-top:16px;padding:16px"><b class="serif" style="font-size:18px">📣 ${esc(t('bc_title'))}</b><p class="hint" style="margin:6px 0 10px">${esc(t('bc_sub'))}</p><textarea class="inp" id="bct" maxlength="1500" placeholder="${esc(t('bc_ph'))}"></textarea><button class="btn main" id="bcs" style="margin-top:10px">${esc(t('bc_send'))}</button></div>`);
  $('bcs').onclick = () => { const v = $('bct').value.trim(); if (v.length < 5) return; const send2 = async (ok) => { if (!ok) return; $('bcs').disabled = true; const z = await api('broadcast', { text: v }); $('bcs').disabled = false; if (z.ok) { $('bct').value = ''; toast(t('bc_done', { n: nf(z.n) })); } else toast(t('e_server')); }; if (tgw && tgw.showConfirm) tgw.showConfirm(t('bc_confirm'), send2); else send2(confirm(t('bc_confirm'))); };
  const act = async (id, ok, b, why) => { b.disabled = true; const r2 = await api('decide', { id, ok, kind: b.dataset.kind || '', why }); haptic('medium'); toast(r2.msg || ''); const card = $('m' + id); if (card) card.remove(); if (!$('app').querySelector('[data-ok]')) mod(); };
  $('app').querySelectorAll('[data-ok]').forEach((b) => b.onclick = () => act(Number(b.dataset.ok), true, b));
  $('app').querySelectorAll('[data-no]').forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.no), card = $('m' + id); if (!card || card.querySelector('.rz')) return;
    const codes = ['desc', 'spam', 'private', 'empty', 'adult', 'photo', 'dup'];
    b.parentElement.insertAdjacentHTML('afterend', `<div class="rz" style="margin-top:12px"><b>${esc(t('rz_title'))}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">${codes.map((c) => `<button class="btn small" data-rz="${c}">${esc(t('rz_' + c))}</button>`).join('')}</div><textarea class="inp" maxlength="500" placeholder="${esc(t('rz_note'))}"></textarea><button class="btn main" data-rzgo data-kind="${esc(b.dataset.kind || '')}" style="margin-top:8px;width:100%">❌ ${esc(t('rz_go'))}</button></div>`);
    const box = card.querySelector('.rz');
    box.querySelectorAll('[data-rz]').forEach((c) => c.onclick = () => { const on = !c.classList.contains('on'); c.classList.toggle('on', on); c.style.background = on ? '#f2b632' : ''; c.style.color = on ? '#13213b' : ''; haptic('light'); });
    box.querySelector('[data-rzgo]').onclick = (e) => act(id, false, e.currentTarget, { codes: [...box.querySelectorAll('[data-rz].on')].map((c) => c.dataset.rz), note: box.querySelector('textarea').value.trim() });
  });
  $('app').querySelectorAll('[data-open]').forEach((b) => b.onclick = () => openLink(b.dataset.open));
}

// ---------- Help, subscription ----------
function help() {
  TAB = 'help'; bar(); $('sbox').style.display = 'none';
  $('app').innerHTML = `<h1>${esc(t('help'))}</h1><div class="faq">${[1, 2, 3, 4, 5].map((i) => `<details><summary>${esc(t('q' + i))}</summary><p>${esc(t('a' + i))}</p></details>`).join('')}</div><div style="margin-top:20px"><button class="btn main" id="sup">${esc(t('contact'))}</button></div>`;
  $('sup').onclick = () => openLink(ME.support);
}
$('helpb').onclick = () => { haptic(); help(); };
$('bellb').onclick = () => { haptic(); notifs(); };
function gate() {
  $('bar').style.display = 'none'; $('sbox').style.display = 'none';
  $('app').innerHTML = `<div class="center"><div class="big" aria-hidden="true">📚</div><h1>${esc(t('gate_title'))}</h1><p class="sub">${esc(t('gate_text'))}</p><div style="display:grid;gap:8px"><button class="btn main" id="gj">${esc(t('gate_join'))}</button><button class="btn" id="gc">${esc(t('gate_check'))}</button></div></div>`;
  $('gj').onclick = () => openLink(ME.channel);
  $('gc').onclick = async () => { $('gc').disabled = true; const m = await api('me', { src: 'app' }); $('gc').disabled = false; if (m.member) { ME = { ...ME, ...m }; $('bar').style.display = ''; haptic('medium'); return go('explore'); } toast(t('gate_not')); };
}
// phones: hide the tab bar while typing
document.addEventListener('focusin', (e) => { if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'file') { document.body.classList.add('typing'); setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) {} }, 300); } });
document.addEventListener('focusout', () => setTimeout(() => { if (!/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) document.body.classList.remove('typing'); }, 120));

(async () => {
  if (tgw) { try { tgw.ready(); tgw.expand(); tgw.disableVerticalSwipes && tgw.disableVerticalSwipes(); tgw.setHeaderColor && tgw.setHeaderColor('#13213a'); tgw.setBackgroundColor && tgw.setBackgroundColor('#f3f5f9'); } catch (e) {} }
  if (!INIT) { $('sbox').style.display = 'none'; $('app').innerHTML = `<div class="center"><div class="big">📚</div><h1>GramPedia</h1><p class="sub">${esc(t('open_tg'))}</p><a class="btn main" href="https://t.me/Grampedia_bot">Telegram</a></div>`; return; }
  try {
    const src = (tgw.initDataUnsafe && tgw.initDataUnsafe.start_param) || '';
    ME = await api('me', { src: src || 'app' }); if (ME.error) throw new Error(ME.error);
    T = { ...EN, ...(ME.t || {}) }; document.documentElement.lang = ME.lang || 'en'; if (['ar', 'fa'].includes(ME.lang)) document.documentElement.dir = 'rtl';
    $('q').placeholder = t('search_ph');
    if (ME.unread) { $('bdot').hidden = false; $('bdot').textContent = ME.unread > 9 ? '9+' : String(ME.unread); }
    if (ME.member === false) { bar(); return gate(); }
    const qs = new URLSearchParams(location.search), want = qs.get('tab');
    if (qs.get('id')) { go('explore'); const one = await api('one', { id: qs.get('id') }); if (one.item) detail(one.item); return; }
    if (want === 'add' && qs.get('link')) { A.link = qs.get('link'); go('add'); return find(); }
    go(['add', 'mine', 'help', 'notifs'].includes(want) || (want === 'mod' && ME.admin) ? want : 'explore');
  } catch (e) { $('app').innerHTML = `<div class="empty"><b>${esc(t('e_server'))}</b></div>`; }
})();
</script>
</body></html>
